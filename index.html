<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Library Management System</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 900px; margin: auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7f8c8d; font-size: 14px; margin-bottom: 25px; }
        .section { margin-bottom: 25px; padding: 20px; background: #fafafa; border: 1px solid #e1e8ed; border-radius: 8px; }
        h2 { font-size: 18px; color: #34495e; margin-top: 0; border-bottom: 2px solid #3498db; padding-bottom: 8px; }
        input, button { padding: 10px; margin: 5px 0; font-size: 14px; border: 1px solid #ccc; border-radius: 5px; width: 100%; box-sizing: border-box; }
        button { background-color: #3498db; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2980b9; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; font-size: 14px; }
        th { background-color: #2c3e50; color: white; }
        .msg { margin-top: 10px; padding: 10px; border-radius: 5px; font-weight: bold; font-size: 14px; display: none; }
        .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Smart Library Management System</h1>
    <div class="subtitle">Meeva Maria Benny | Amal Jyothi College of Engineering | CSE</div>

    <!-- Book List Section -->
    <div class="section">
        <h2>Library Catalog (Books Shelf)</h2>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Title</th>
                    <th>Author</th>
                    <th>Status</th>
                    <th>Borrower</th>
                </tr>
            </thead>
            <tbody id="bookTable">
                <!-- Books will load here -->
            </tbody>
        </table>
    </div>

    <div class="grid">
        <!-- Add Book Section -->
        <div class="section">
            <h2>Add New Book</h2>
            <input type="number" id="addId" placeholder="Book ID (e.g. 106)">
            <input type="text" id="addTitle" placeholder="Book Title">
            <input type="text" id="addAuthor" placeholder="Author Name">
            <button onclick="addBook()">Add to Shelf</button>
            <div id="addMsg" class="msg"></div>
        </div>

        <!-- Issue Book Section -->
        <div class="section">
            <h2>Issue Book</h2>
            <input type="number" id="issueId" placeholder="Book ID">
            <input type="text" id="issueMember" placeholder="Member Name">
            <button onclick="issueBook()">Issue Book</button>
            <div id="issueMsg" class="msg"></div>
        </div>
    </div>
</div>

<script>
    // Initial sample data based on your Java code
    let books = [
        { id: 101, title: "Data Structures in Java", author: "Robert Lafore", avail: true, borrower: "-" },
        { id: 102, title: "Introduction to Algorithms", author: "Thomas Cormen", avail: true, borrower: "-" },
        { id: 103, title: "Clean Code", author: "Robert C. Martin", avail: true, borrower: "-" },
        { id: 104, title: "Operating System Concepts", author: "Abraham Silberschatz", avail: true, borrower: "-" },
        { id: 105, title: "Let Us C", author: "Yashavant Kanetkar", avail: true, borrower: "-" }
    ];

    function renderBooks() {
        const tbody = document.getElementById('bookTable');
        tbody.innerHTML = "";
        books.forEach(b => {
            let tr = document.createElement('tr');
            tr.innerHTML = `<td>${b.id}</td><td>${b.title}</td><td>${b.author}</td><td>${b.avail ? 'Available' : 'Issued'}</td><td>${b.borrower}</td>`;
            tbody.appendChild(tr);
        });
    }

    function showMsg(elementId, text, isSuccess) {
        let el = document.getElementById(elementId);
        el.innerText = text;
        el.className = "msg " + (isSuccess ? "success" : "error");
        el.style.display = "block";
        setTimeout(() => el.style.display = "none", 4000);
    }

    function addBook() {
        let id = parseInt(document.getElementById('addId').value);
        let title = document.getElementById('addTitle').value.trim();
        let author = document.getElementById('addAuthor').value.trim();

        if(!id || !title || !author) {
            showMsg('addMsg', "Please fill every field with valid values.", false);
            return;
        }
        if(books.some(b => b.id === id)) {
            showMsg('addMsg', "Duplicate ID - a book with this ID already exists.", false);
            return;
        }

        books.push({ id, title, author, avail: true, borrower: "-" });
        books.sort((a, b) => a.id - b.id);
        renderBooks();
        showMsg('addMsg', `Successfully added "${title}"!`, true);
        
        document.getElementById('addId').value = "";
        document.getElementById('addTitle').value = "";
        document.getElementById('addAuthor').value = "";
    }

    function issueBook() {
        let id = parseInt(document.getElementById('issueId').value);
        let member = document.getElementById('issueMember').value.trim();

        let book = books.find(b => b.id === id);
        if(!book || !member) {
            showMsg('issueMsg', "Please enter a valid Book ID and Member name.", false);
            return;
        }
        if(!book.avail) {
            showMsg('issueMsg', `Book is already issued to ${book.borrower}.`, false);
            return;
        }

        book.avail = false;
        book.borrower = member;
        renderBooks();
        showMsg('issueMsg', `Issued "${book.title}" to ${member}!`, true);
        
        document.getElementById('issueId').value = "";
        document.getElementById('issueMember').value = "";
    }

    // Initial load
    renderBooks();
</script>

</body>
</html>
